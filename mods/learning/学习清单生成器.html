// ==================== APP LOGIC ====================
let data = [];
let STORAGE_KEY = 'lc_data_v2';

function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.length > 0 && parsed[0].items) {
        data = parsed;
        render();
        return;
      }
    } catch(e) { /* corrupted, fall through */ }
  }
  // First time: load from embedded plan
  data = PLAN.map(t => ({ topic: t.topic, items: t.items.map(i => ({ text: i.t, tags: i.tg ? [i.tg] : [], done: false })) }));
  render();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function render() {
  save();
  const list = document.getElementById('list');
  const stats = document.getElementById('stats');
  let total = 0, done = 0;
  data.forEach(t => { total += t.items.length; t.items.forEach(i => { if (i.done) done++; }); });

  // Stats (simple)
  stats.innerHTML = `
    <div class="stat-card"><div class="num">${data.length}</div><div class="label">知识模块</div></div>
    <div class="stat-card"><div class="num">${total}</div><div class="label">总知识点</div></div>
    <div class="stat-card"><div class="num">${done}</div><div class="label">已完成</div></div>
    <div class="stat-card"><div class="num">${total ? Math.round(done/total*100) : 0}%</div><div class="label">完成率</div></div>
  `;

  let num = 0;
  let html = '';

  data.forEach((topic, ti) => {
    const topicDone = topic.items.filter(i => i.done).length;
    const startNum = num + 1;
    const isOpen = (topic._collapsed !== true);

    let body = '';
    let lastTag = '';
    topic.items.forEach((item, ii) => {
      num++;
      const tag = item.tags[0] || '';
      if (tag !== lastTag && tag) {
        const labels = { '教程':'📺 学习教程', '概念':'💡 核心概念', '自查':'🔍 自我检查', '项目':'🛠 项目实战', '练习':'✏️ 动手练习', '复习':'🔄 复习回顾', 'AI':'🤖 AI 协作' };
        if (labels[tag]) body += `<div class="sub-header">${labels[tag]}</div>`;
        lastTag = tag;
      }
      const dc = item.done ? ' done' : '';
      const cc = item.done ? ' done' : '';
      const tagHtml = (item.tags||[]).map(tg => {
        const cls = 'tag-'+tg;
        return `<span class="tag ${cls}">${tg}</span>`;
      }).join('');
      body += `<div class="item${dc}" data-t="${ti}" data-i="${ii}"><div class="item-num">${num}</div><div class="item-check${cc}" onclick="toggle(${ti},${ii})"></div><div class="item-text">${item.text}${tagHtml}</div></div>`;
    });

    const endNum = num;
    html += `<div class="topic-section"><div class="topic-header" onclick="toggleSection(${ti})"><h2><span class="badge">#${startNum}-${endNum}</span>${topic.topic}</h2><div style="display:flex;align-items:center;gap:10px;"><span style="font-size:0.78rem;color:#999;">${topicDone}/${topic.items.length}</span><span class="arrow${isOpen?' open':''}">▶</span></div></div><div class="topic-body${isOpen?' open':''}">${body}</div></div>`;
  });

  list.innerHTML = html;
}

function toggle(ti, ii) {
  data[ti].items[ii].done = !data[ti].items[ii].done;
  render();
}

function toggleSection(ti) {
  data[ti]._collapsed = !data[ti]._collapsed;
  render();
}

function expandAll() { data.forEach(t => t._collapsed = false); render(); }
function collapseAll() { data.forEach(t => t._collapsed = true); render(); }

function resetData() {
  if (!confirm('确定要重置所有勾选状态吗？')) return;
  data.forEach(t => t.items.forEach(i => i.done = false));
  data.forEach(t => t._collapsed = false);
  render();
}

function exportData() {
  const blob = new Blob([JSON.stringify({data, exportedAt: new Date().toISOString()}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '学习进度_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d.data && d.data.length > 0) { data = d.data; render(); alert('进度已恢复！'); }
        else alert('文件格式不对');
      } catch(err) { alert('文件解析失败'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

function doSearch() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.item').forEach(el => {
    el.style.display = el.querySelector('.item-text').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.topic-section').forEach(sec => {
    const vis = sec.querySelectorAll('.item[style*="none"]').length < sec.querySelectorAll('.item').length;
    sec.style.display = vis ? '' : 'none';
  });
}

// ==================== BOOT ====================
init();
</script>
