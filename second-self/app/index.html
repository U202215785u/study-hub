<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Self</title>
<style>
:root {
  --cyan:   #00d4ff;
  --blue:   #0066cc;
  --dark:   #060a10;
  --panel:  #0a1018;
  --border: #0d2030;
  --text:   #8899aa;
  --text2:  #556677;
  --glow:   0 0 20px rgba(0,212,255,0.3);
  --radius: 4px;
  --font: 'Segoe UI', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--dark);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  background: rgba(6,10,16,0.95); z-index: 20;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.topbar .logo {
  font-size: 15px; font-weight: 700; color: var(--cyan);
  letter-spacing: 3px; text-shadow: var(--glow);
}
.topbar .stats {
  display: flex; gap: 20px; font-size: 11px; letter-spacing: 1px;
  color: var(--text2);
}
.topbar .stats span { color: var(--cyan); }

.main-layout {
  flex: 1; display: flex; min-height: 0; position: relative; z-index: 1;
}

.hero-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; min-width: 0;
}
#hero-canvas {
  position: absolute; inset: 0; cursor: grab;
}
.hero-ring {
  position: absolute; border-radius: 50%;
  border: 1px solid rgba(0,212,255,0.12); pointer-events: none;
}
.hero-ring.r1 { width: 420px; height: 420px; top:50%; left:50%; transform: translate(-50%,-50%); animation: spin 30s linear infinite; }
.hero-ring.r2 { width: 300px; height: 300px; top:50%; left:50%; transform: translate(-50%,-50%); animation: spin 20s linear infinite reverse; border-color: rgba(0,212,255,0.2); }
.hero-ring.r3 { width: 180px; height: 180px; top:50%; left:50%; transform: translate(-50%,-50%); animation: spin 12s linear infinite; border-color: rgba(0,212,255,0.3); box-shadow: var(--glow); }
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

.hero-label {
  position: absolute; bottom: 100px;
  text-align: center; pointer-events: none;
}
.hero-label .mode { font-size: 12px; letter-spacing: 4px; color: var(--cyan); text-shadow: var(--glow); }
.hero-label .hint { font-size: 10px; color: var(--text2); margin-top: 4px; }

.response-bubble {
  position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
  max-width: 500px; text-align: center; font-size: 13px; line-height: 1.7;
  color: #aaccee; text-shadow: 0 0 10px rgba(100,180,255,0.2);
  pointer-events: none; transition: opacity 0.4s;
}
.response-bubble .quote { color: var(--cyan); font-style: italic; }
.response-bubble .result { margin-top: 6px; font-size: 11px; color: var(--text2); }

.side-panel {
  width: 320px; background: rgba(10,16,24,0.96);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 16px;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px); gap: 14px;
  transition: transform 0.3s;
}
.side-panel.hidden { transform: translateX(320px); }

.panel-section h4 {
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--text2); margin-bottom: 8px; border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}
.project-card, .memory-item, .maint-item {
  background: rgba(0,20,40,0.5); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
  font-size: 11px;
}
.project-card .name { color: #cce; font-weight: 600; }
.project-card .info { color: var(--text2); margin-top: 3px; font-size: 10px; }
.project-card .stalled { color: #e05555; }
.maint-item .task { color: #aac; }
.maint-item .deadline { color: #665; font-size: 10px; }

/* 记忆场可视化 */
.field-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600; letter-spacing: 1px;
  background: rgba(0,180,255,0.15); border: 1px solid var(--cyan);
  color: var(--cyan); margin-bottom: 8px;
  transition: all 0.3s;
}
.field-badge.创作场 { background: rgba(255,150,50,0.15); border-color: #ff9632; color: #ff9632; }
.field-badge.决策场 { background: rgba(150,100,255,0.15); border-color: #9664ff; color: #9664ff; }
.field-badge.学习场 { background: rgba(50,200,100,0.15); border-color: #32c864; color: #32c864; }
.field-badge.社交场 { background: rgba(255,100,150,0.15); border-color: #ff6496; color: #ff6496; }
.field-badge.执行场 { background: rgba(100,180,255,0.15); border-color: #64b4ff; color: #64b4ff; }
.field-badge.通用场 { background: rgba(150,160,170,0.15); border-color: #96a0aa; color: #96a0aa; }

.emotion-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px; font-size: 10px;
}
.emotion-label {
  padding: 2px 8px; border-radius: 8px;
  background: rgba(0,20,40,0.6); color: #ffaa66;
  border: 1px solid rgba(255,170,102,0.3);
  text-transform: uppercase; letter-spacing: 1px;
}
.emotion-label.neutral { color: #8899aa; border-color: rgba(136,153,170,0.3); }
.emotion-tuning {
  color: var(--text2); font-size: 10px; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.field-layers { display: flex; flex-direction: column; gap: 6px; }
.layer {
  background: rgba(0,20,40,0.4); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 10px;
}
.layer-title {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text2); margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.layer-title::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
}
.core-layer .layer-title::before { background: #ff6644; box-shadow: 0 0 6px #ff6644; }
.active-layer .layer-title::before { background: #44cc88; box-shadow: 0 0 6px #44cc88; }
.suppress-layer .layer-title::before { background: #556677; }

.layer-items { font-size: 10px; color: #aac; line-height: 1.6; }
.layer-item {
  display: flex; align-items: center; gap: 6px;
  padding: 2px 0; border-bottom: 1px solid rgba(0,30,60,0.3);
}
.layer-item:last-child { border-bottom: none; }
.layer-item .temp-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}
.temp-dot.hot { background: #ff6644; box-shadow: 0 0 4px #ff6644; }
.temp-dot.warm { background: #ffaa33; }
.temp-dot.cool { background: #44aacc; }
.layer-item .item-source {
  color: var(--text2); font-size: 9px; flex-shrink: 0;
}
.layer-item .item-preview {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1;
}

.ctrl-bar {
  display: flex; justify-content: center; align-items: center;
  gap: 18px; padding: 10px 20px 16px;
  border-top: 1px solid var(--border);
  background: rgba(6,10,16,0.95); z-index: 20;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.ctrl-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--cyan); cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.ctrl-btn:hover { border-color: var(--cyan); box-shadow: var(--glow); }
.ctrl-btn.active {
  background: rgba(0,180,255,0.2); border-color: var(--cyan);
  box-shadow: 0 0 30px rgba(0,200,255,0.5); animation: btnGlow 1.5s infinite;
}
.ctrl-btn.voice-btn {
  width: 64px; height: 64px; font-size: 26px;
  background: radial-gradient(circle, rgba(0,180,255,0.2), transparent);
}
.ctrl-label { font-size: 9px; letter-spacing: 1px; color: var(--text2); text-align: center; margin-top: 3px; }
.ctrl-group { text-align: center; }
.status-online { color: #4caf7d; }
.memory-info { font-size: 10px; color: var(--text2); }
.empty-state { color: var(--text2); font-size: 10px; }
.empty-text { color: var(--text2); }
.layer-header { color: var(--text2); font-size: 9px; margin: 3px 0 2px; text-transform: uppercase; letter-spacing: 1px; }
.suppress-tag { display: inline-block; padding: 1px 6px; margin: 1px; border-radius: 3px; background: rgba(85,102,119,0.2); color: #667788; font-size: 9px; }
.stat-cyan { color: var(--cyan); }
.stat-green { color: #4caf7d; }
.stat-dim { color: var(--text2); }
@keyframes btnGlow { 0%,100%{box-shadow:0 0 20px rgba(0,200,255,0.3)} 50%{box-shadow:0 0 50px rgba(0,200,255,0.7)} }

.chat-input-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-top: 1px solid var(--border);
  background: rgba(6,10,16,0.98); z-index: 20;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.chat-input {
  flex: 1; background: rgba(0,20,40,0.6); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px;
  color: #aaccee; font-size: 13px; outline: none;
  transition: border-color 0.2s;
}
.chat-input:focus { border-color: var(--cyan); }
.chat-input::placeholder { color: var(--text2); }
.chat-send-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--cyan); background: rgba(0,180,255,0.15);
  color: var(--cyan); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.chat-send-btn:hover { background: rgba(0,180,255,0.3); box-shadow: var(--glow); }
.chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.decision-overlay {
  position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
  width: 270px; background: rgba(10,16,24,0.97);
  border: 1px solid var(--cyan); border-radius: var(--radius);
  padding: 16px; z-index: 50; font-size: 11px;
  box-shadow: 0 0 30px rgba(0,180,255,0.2);
  display: none;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.decision-overlay.show { display: block; }
.decision-overlay h4 { color: var(--cyan); font-size: 11px; letter-spacing: 3px; margin-bottom: 10px; }
.decision-overlay .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(0,30,60,0.5); }
.decision-overlay .row .k { color: #556677; }
.decision-overlay .row .v { color: #aaccee; max-width: 160px; text-align: right; }
.decision-overlay .v.high { color: #ff6644; }
.decision-overlay .v.med  { color: #ffaa33; }
.decision-overlay .v.low  { color: #44aacc; }

.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(0,20,40,0.95); border: 1px solid var(--cyan);
  color: var(--cyan); padding: 8px 20px; border-radius: 2px;
  font-size: 11px; letter-spacing: 2px; z-index: 200;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

@media (max-width: 768px) {
  .side-panel { width: 260px; }
  .side-panel.hidden { transform: translateX(260px); }
  .ctrl-btn { width: 40px; height: 40px; font-size: 15px; }
  .ctrl-btn.voice-btn { width: 52px; height: 52px; font-size: 22px; }
}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">◈ SECOND SELF</span>
  <div class="stats">
    <span id="statMemory">0</span> 记忆 ·
    <span id="statProjects">0</span> 项目 ·
    <span id="statStatus" class="status-online">在线</span>
  </div>
</div>

<div class="main-layout">
  <div class="hero-area" id="heroArea">
    <div id="hero-canvas"></div>
    <div class="hero-ring r1"></div>
    <div class="hero-ring r2"></div>
    <div class="hero-ring r3"></div>
    <div class="hero-label">
      <div class="mode" id="modeLabel">系统就绪</div>
      <div class="hint" id="hintLabel">点击输入框打字 · 空格键语音 · 回车发送</div>
    </div>
    <div class="response-bubble" id="responseBubble"></div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="panel-section">
      <h4>◆ 记忆场</h4>
      <div id="memoryFieldPanel">
        <div class="field-badge" id="fieldBadge">通用场</div>
        <div class="emotion-bar">
          <span class="emotion-label" id="emotionLabel">neutral</span>
          <span class="emotion-tuning" id="emotionTuning"></span>
        </div>
        <div class="field-layers" id="fieldLayers">
          <div class="layer core-layer">
            <div class="layer-title">核心层</div>
            <div class="layer-items" id="coreLayerItems">—</div>
          </div>
          <div class="layer active-layer">
            <div class="layer-title">情境层</div>
            <div class="layer-items" id="activeLayerItems">—</div>
          </div>
          <div class="layer suppress-layer">
            <div class="layer-title">抑制层</div>
            <div class="layer-items" id="suppressLayerItems">—</div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-section">
      <h4>◆ 战略项目</h4>
      <div id="projectsList">加载中…</div>
    </div>
    <div class="panel-section">
      <h4>◆ 维护清单</h4>
      <div id="maintList">加载中…</div>
    </div>
    <div class="panel-section">
      <h4>◆ 记忆库</h4>
      <div id="memoryInfo" class="memory-info">加载中…</div>
    </div>
  </div>
</div>

<div class="chat-input-bar" id="chatInputBar">
  <input type="text" class="chat-input" id="chatInput" placeholder="和 Second Self 对话..." autocomplete="off">
  <button class="chat-send-btn" id="btnSend" title="发送">➤</button>
</div>

<div class="ctrl-bar">
  <div class="ctrl-group"><button class="ctrl-btn" id="btnPanel" title="显示/隐藏面板">☰</button><div class="ctrl-label">面板</div></div>
  <div class="ctrl-group"><button class="ctrl-btn voice-btn" id="btnVoice" title="语音对话">🎤</button><div class="ctrl-label">语音</div></div>
  <div class="ctrl-group"><button class="ctrl-btn" id="btnDecide" title="分析想法">⚡</button><div class="ctrl-label">分析</div></div>
  <div class="ctrl-group"><button class="ctrl-btn" id="btnReset" title="重置头像">⟳</button><div class="ctrl-label">重置</div></div>
</div>

<div class="decision-overlay" id="decisionOverlay">
  <h4>◈ 决策分析</h4>
  <div id="decisionContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let panelVisible = true;

async function loadDashboard() {
  try {
    const [selfResp, memResp] = await Promise.all([
      fetch(`${API}/self`),
      fetch(`${API}/memory/stats`),
    ]);
    const self = await selfResp.json();
    const mem = await memResp.json();

    const projects = self.dashboard?.strategic_projects || [];
    document.getElementById('statProjects').textContent = projects.length;
    document.getElementById('projectsList').innerHTML = projects.map(p => {
      const updated = p.updated || '未知';
      const daysAgo = calcDaysAgo(updated);
      const stallClass = daysAgo > 14 ? ' stalled' : '';
      return `<div class="project-card">
        <div class="name">${esc(p.name)}</div>
        <div class="info">${esc(p.progress || '')}</div>
        <div class="info${stallClass}">更新: ${updated} (${daysAgo}天前)</div>
      </div>`;
    }).join('') || '<div class="empty-state">暂无项目</div>';

    const items = self.dashboard?.maintenance_items || [];
    document.getElementById('maintList').innerHTML = items.slice(0, 6).map(i =>
      `<div class="maint-item">
        <div class="task">${esc(i.task)}</div>
        <div class="deadline">${esc(i.deadline || '')}</div>
      </div>`
    ).join('') || '<div class="empty-state">暂无待办</div>';

    document.getElementById('statMemory').textContent = mem.total || 0;
    document.getElementById('memoryInfo').innerHTML = `
      总计 <b class="stat-cyan">${mem.total||0}</b> 条 ·
      活跃 <b class="stat-green">${mem.active||0}</b> 条 ·
      休眠 <b class="stat-dim">${mem.dormant||0}</b> 条
    `;
  } catch (e) {
    console.error('Dashboard load error:', e);
  }
}

function showMemoryField(field) {
  if (!field) return;
  const badge = document.getElementById('fieldBadge');
  const ft = field.field_type || '通用场';
  badge.textContent = ft;
  badge.className = 'field-badge ' + ft;
  badge.dataset.updated = '1';

  const emotionLabel = document.getElementById('emotionLabel');
  const es = field.emotional_state || 'neutral';
  emotionLabel.textContent = es;
  emotionLabel.className = 'emotion-label ' + es;

  const tuning = document.getElementById('emotionTuning');
  tuning.textContent = field.emotional_tuning || '';
  tuning.title = field.emotional_tuning || '';

  const coreEl = document.getElementById('coreLayerItems');
  const core = field.core || {};
  let coreHtml = '';
  for (const [layerName, memories] of Object.entries(core)) {
    for (const m of memories) {
      const temp = m.temperature || 0;
      const tempClass = temp >= 0.8 ? 'hot' : temp >= 0.4 ? 'warm' : 'cool';
      const source = (m.source || layerName).replace(/^self:\/\//, '').replace(/\.md$/, '');
      const preview = (m.content || '').replace(/\n/g, ' ').slice(0, 40);
      coreHtml += `<div class="layer-item">
        <span class="temp-dot ${tempClass}"></span>
        <span class="item-source">${esc(source)}</span>
        <span class="item-preview">${esc(preview)}</span>
      </div>`;
    }
  }
  coreEl.innerHTML = coreHtml || '<span class="empty-text">—</span>';

  const activeEl = document.getElementById('activeLayerItems');
  const activated = field.activated || {};
  let activeHtml = '';
  for (const [layerName, memories] of Object.entries(activated)) {
    if (!memories || memories.length === 0) continue;
    activeHtml += `<div style="color:var(--text2);font-size:9px;margin:3px 0 2px;text-transform:uppercase;letter-spacing:1px;">${esc(layerName)} <span style="margin-left:auto">${memories.length}</span></div>`;
    for (const m of memories) {
      const temp = m.temperature || 0;
      const tempClass = temp >= 0.8 ? 'hot' : temp >= 0.4 ? 'warm' : 'cool';
      const source = (m.source || '').replace(/^self:\/\//, '').replace(/\.md$/, '').slice(0, 15);
      const preview = (m.content || '').replace(/\n/g, ' ').slice(0, 35);
      activeHtml += `<div class="layer-item">
        <span class="temp-dot ${tempClass}"></span>
        <span class="item-source">${esc(source)}</span>
        <span class="item-preview">${esc(preview)}</span>
      </div>`;
    }
  }
  activeEl.innerHTML = activeHtml || '<span class="empty-text">—</span>';

  const suppressEl = document.getElementById('suppressLayerItems');
  const suppressed = field.suppressed || [];
  if (suppressed.length > 0) {
    suppressEl.innerHTML = suppressed.map(s =>
      `<span class="suppress-tag">${esc(s)}</span>`
    ).join(' ');
  } else {
    suppressEl.innerHTML = '<span class="empty-text">—</span>';
  }
}

async function processMessage(text) {
  try {
    const resp = await fetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ message: text }),
    });

    if (!resp.ok || !resp.body) {
      throw new Error('流式响应异常');
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullReply = '';
    let buffer = '';
    let flushTimer = null;

    function flushDisplay() {
      flushTimer = null;
      if (buffer) {
        fullReply += buffer;
        buffer = '';
        showResponseStreaming(`你说："${text}"`, fullReply);
      }
    }
    function scheduleFlush() {
      if (!flushTimer) flushTimer = setTimeout(flushDisplay, 50);
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const dataStr = line.slice(6).trim();
        if (dataStr === '[DONE]') continue;
        try {
          const parsed = JSON.parse(dataStr);
          if (parsed.decision) showDecision({ decision: parsed.decision });
          if (parsed.memory_field) showMemoryField(parsed.memory_field);
          if (parsed.token) { buffer += parsed.token; scheduleFlush(); }
        } catch (e) {}
      }
    }

    if (flushTimer) clearTimeout(flushTimer);
    flushDisplay();
    if (fullReply) showResponseFinal(`你说："${text}"`, fullReply);
    loadDashboard();
    const badge = document.getElementById('fieldBadge');
    if (badge) delete badge.dataset.updated;
  } catch (e) {
    console.error('Stream error:', e);
    try {
      const resp = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: text }),
      });
      const data = await resp.json();
      if (data.decision) showDecision(data);
      if (data.memory_field) showMemoryField(data.memory_field);
      showResponseFinal(`你说："${text}"`, data.reply || '...');
      loadDashboard();
    } catch (e2) {
      showResponseFinal('', '连接失败，请确认服务器已启动');
    }
  }
}

function showResponse(quote, result, streaming) {
  const el = document.getElementById('responseBubble');
  const q = quote ? `<span class="quote">${esc(quote)}</span>` : '';
  const r = result ? (streaming ? result : esc(result)) : '';
  el.innerHTML = q + (r ? `<div class="result">${r}</div>` : '');
}
function showResponseStreaming(quoteText, resultText) {
  const el = document.getElementById('responseBubble');
  let quoteEl = el.querySelector('.quote');
  if (!quoteEl && quoteText) { quoteEl = document.createElement('span'); quoteEl.className = 'quote'; el.appendChild(quoteEl); }
  if (quoteEl) quoteEl.textContent = quoteText;
  let resultEl = el.querySelector('.result');
  if (!resultEl) { resultEl = document.createElement('div'); resultEl.className = 'result'; el.appendChild(resultEl); }
  resultEl.textContent = resultText;
}
function showResponseFinal(quoteText, resultText) {
  const el = document.getElementById('responseBubble');
  const q = quoteText ? `<span class="quote">${esc(quoteText)}</span>` : '';
  const r = resultText ? `<div class="result">${simpleMarkdown(resultText)}</div>` : '';
  el.innerHTML = q + r;
}
function simpleMarkdown(text) {
  let safe = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}
function showDecision(data) {
  const d = data?.decision;
  if (!d) return;
  const rows = [
    ['优先级', d.priority||'?', d.priority==='HIGH'?'high':d.priority==='MEDIUM'?'med':'low'],
    ['关联项目', d.linked_project||'无', ''],
    ['反模式', d.anti_pattern_risk?.detected?'⚠ '+d.anti_pattern_risk.description:'无', ''],
    ['授权', d.autonomy_level?.level||'?', ''],
    ['下一步', d.suggested_next_step||'', ''],
  ];
  document.getElementById('decisionContent').innerHTML = rows.map(([k,v,cls]) =>
    `<div class="row"><span class="k">${k}</span><span class="v ${cls}">${esc(String(v))}</span></div>`
  ).join('');
  document.getElementById('decisionOverlay').classList.add('show');
  setTimeout(() => document.getElementById('decisionOverlay').classList.remove('show'), 8000);
}
function togglePanel() {
  panelVisible = !panelVisible;
  document.getElementById('sidePanel').classList.toggle('hidden', !panelVisible);
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function calcDaysAgo(dateStr) {
  if (!dateStr) return '?';
  const d = new Date(dateStr), now = new Date();
  return Math.floor((now - d) / 86400000);
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// 事件绑定
document.getElementById('btnPanel').addEventListener('click', togglePanel);
document.getElementById('btnDecide').addEventListener('click', () => {
  const text = prompt('输入想法，我帮你分析：');
  if (text?.trim()) { showResponse(`"${text}"`); processMessage(text); }
});
document.getElementById('btnReset').addEventListener('click', () => toast('头像重置'));
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
document.getElementById('btnSend').addEventListener('click', sendChat);

async function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  showResponse(`你说："${text}"`, '思考中...', true);
  await processMessage(text);
}

loadDashboard();
console.log('◈ Second Self 已就绪');
</script>
