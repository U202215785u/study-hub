[permissions]
allow = ["Bash=git log --oneline -30 && echo \"---BRANCHES---\" && git branch -a | head -30 && echo \"---STATUS---\" && git status --short | head -20", "Bash=powershell -NoProfile -Command \"Get-CimInstance Win32_Process -Filter \\\"Name='node.exe' OR Name='ChatGPT.exe'\\\" | Select-Object ProcessId, Name, @{N='Cmd';E={\\$_.CommandLine.Substring(0, [Math]::Min(160, \\$_.CommandLine.Length))}} | Format-Table -AutoSize -Wrap\" 2>&1 | head -40", "Bash=echo \"=== 文档引用的关键文件 ===\"; for f in connect-codex.ps1 start-local.ps1 stop-injector.ps1 scripts/codex-injector.mjs scripts/codex-injector-runtime.mjs inject/codex-taskboard.user.js server/app.mjs skills/manage-taskboard/SKILL.md README.md docs/windows-codex-integration-plan.md; do if [ -e \"dashi-taskboard/$f\" ]; then echo \"OK  $f\"; else echo \"MISSING  $f\"; fi; done; echo; echo \"=== .gitignore 覆盖 .data? ===\"; grep -n \"data\\|profile\\|sqlite\\|\\.log\\|\\.png\\|\\.pid\" dashi-taskboard/.gitignore"]
