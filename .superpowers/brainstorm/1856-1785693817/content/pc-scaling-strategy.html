<style>

<h2>16:9 PC 下，工作台应该怎样适配？</h2>
<p class="subtitle">三种方案都保持设计稿的信息架构，区别在于不同分辨率下如何处理尺寸。</p>

<div class="cards">
  <div class="card" data-choice="uniform-scale" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mini-screen scale-all">
        <div class="mini-shell">
          <div class="mini-nav"><span class="mini-logo"></span><span class="mini-pill"></span><span class="mini-pill"></span><span class="mini-pill"></span><span class="mini-search"></span></div>
          <div class="mini-greeting"><span></span><i></i></div>
          <div class="mini-grid"><div class="mini-card heat"></div><div class="mini-card"></div><div class="mini-card tall"></div><div class="mini-card queue"></div><div class="mini-card stack"><b></b><b></b></div><div class="mini-card flow"></div></div>
        </div>
      </div>
    </div>
    <div class="card-body"><h3>A. 整体等比缩放</h3><p>把整个 1440 画板当图片缩放。位置最像，但小屏文字和点击区域也会一起缩小。</p><div class="rule">比例固定 · 字体跟着缩放 · 可读性风险高</div></div>
  </div>

  <div class="card" data-choice="fluid-container" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mini-screen fluid">
        <div class="mini-shell">
          <div class="mini-nav"><span class="mini-logo"></span><span class="mini-pill"></span><span class="mini-pill"></span><span class="mini-pill"></span><span class="mini-search"></span></div>
          <div class="mini-greeting"><span></span><i></i></div>
          <div class="mini-grid"><div class="mini-card heat"></div><div class="mini-card"></div><div class="mini-card tall"></div><div class="mini-card queue"></div><div class="mini-card stack"><b></b><b></b></div><div class="mini-card flow"></div></div>
        </div>
      </div>
    </div>
    <div class="card-body"><h3>B. 流式比例容器 <span class="recommended">推荐</span></h3><p>模块位置与宽高比例不变；间距和卡片宽度随窗口收紧，字体和控件保持可读。</p><div class="rule">结构固定 · 尺寸有上下限 · 兼顾还原和真实使用</div></div>
  </div>

  <div class="card" data-choice="fixed-canvas" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mini-screen fixed-canvas">
        <div class="mini-shell">
          <div class="mini-nav"><span class="mini-logo"></span><span class="mini-pill"></span><span class="mini-pill"></span><span class="mini-pill"></span><span class="mini-search"></span></div>
          <div class="mini-greeting"><span></span><i></i></div>
          <div class="mini-grid"><div class="mini-card heat"></div><div class="mini-card"></div><div class="mini-card tall"></div><div class="mini-card queue"></div><div class="mini-card stack"><b></b><b></b></div><div class="mini-card flow"></div></div>
        </div>
      </div>
    </div>
    <div class="card-body"><h3>C. 固定设计画布</h3><p>工作台保持固定尺寸并居中，大屏增加留白；较小 PC 需要纵向滚动或裁切。</p><div class="rule">像素最稳定 · 小屏利用率低 · 容易出现滚动</div></div>
  </div>
</div>
