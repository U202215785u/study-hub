<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 300px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a24; color: #e0e0e8; }
h3 { font-size: 15px; margin-bottom: 12px; }
label { display: block; font-size: 12px; color: #8888a0; margin-bottom: 4px; }
input { width: 100%; padding: 8px 10px; margin-bottom: 10px; background: #0f0f14; border: 1px solid #2a2a3a; border-radius: 6px; color: #e0e0e8; font-size: 13px; outline: none; }
input:focus { border-color: #7c8aff; }
.btn { width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
.btn.primary { background: #7c8aff; color: #fff; }
.btn.secondary { background: #2a2a3a; color: #e0e0e8; }
.btn:hover { opacity: 0.9; }
.status { font-size: 12px; color: #8888a0; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<h3>学习中枢</h3>
<label for="apiBase">后端地址</label>
<input type="text" id="apiBase" placeholder="http://localhost:8741">
<button class="btn primary" id="saveBtn">保存配置</button>
<button class="btn secondary" id="captureBtn">立即采集当前页面</button>
<div class="status" id="status"></div>
<script src="popup.js"></script>
</body>
</html>
