<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a24; color: #e0e0e8; }
h3 { font-size: 15px; margin-bottom: 12px; }
label { display: block; font-size: 12px; color: #8888a0; margin-bottom: 4px; }
input { width: 100%; padding: 8px 10px; margin-bottom: 10px; background: #0f0f14; border: 1px solid #2a2a3a; border-radius: 6px; color: #e0e0e8; font-size: 13px; outline: none; }
input:focus { border-color: #7c8aff; }
.btn { width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; margin-bottom: 6px; transition: all 0.2s; }
.btn.primary { background: #7c8aff; color: #fff; }
.btn.secondary { background: #2a2a3a; color: #e0e0e8; }
.btn.success { background: #4ec9a0; color: #fff; }
.btn:hover { opacity: 0.9; }
.status { font-size: 12px; color: #8888a0; text-align: center; margin-top: 8px; min-height: 18px; }
.section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #2a2a3a; }
.section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
</style>
</head>
<body>

<div class="section">
  <h3>⚙️ 配置</h3>
  <label for="apiBase">后端地址</label>
  <input type="text" id="apiBase" placeholder="http://localhost:8741">
  <button class="btn primary" id="saveBtn">保存配置</button>
</div>

<div class="section">
  <h3>📄 采集</h3>
  <button class="btn secondary" id="captureBtn">📄 采集到知识库</button>
  <button class="btn secondary" id="clipPageBtn">📄 剪藏当前网页</button>
</div>

<div class="section" id="douyinSection" style="display:none;">
  <h3>📹 抖音收藏导入</h3>
  <p style="font-size: 12px; color: #888; margin-bottom: 10px;">
    在抖音收藏页面点击下方按钮，自动采集并批量解析你收藏的视频。
  </p>
  <button class="btn success" id="douyinFavBtn">🔄 采集当前页收藏</button>
  <div id="douyinStatus" style="font-size: 12px; color: #888; margin-top: 8px; min-height: 18px;"></div>
  <div id="douyinLinkList" style="max-height: 120px; overflow-y: auto; font-size: 11px; color: #ccc; margin-top: 6px; display: none;"></div>
</div>

<div class="status" id="status"></div>

<script src="douyin-favorites.js"></script>
<script src="popup.js"></script>
</body>
</html>
