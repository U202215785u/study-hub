<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 360px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #1a1a24; color: #e0e0e8; }
h3 { font-size: 15px; margin-bottom: 12px; }
h4 { font-size: 13px; margin: 12px 0 8px; color: #8888a0; }
label { display: block; font-size: 12px; color: #8888a0; margin-bottom: 4px; }
input { width: 100%; padding: 8px 10px; margin-bottom: 10px; background: #0f0f14; border: 1px solid #2a2a3a; border-radius: 6px; color: #e0e0e8; font-size: 13px; outline: none; }
input:focus { border-color: #7c8aff; }
.btn { width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; margin-bottom: 6px; transition: all 0.2s; }
.btn.primary { background: #7c8aff; color: #fff; }
.btn.secondary { background: #2a2a3a; color: #e0e0e8; }
.btn.success { background: #4ec9a0; color: #fff; }
.btn.danger { background: #ff5c7a; color: #fff; }
.btn:hover { opacity: 0.9; }
.status { font-size: 12px; color: #8888a0; text-align: center; margin-top: 8px; min-height: 18px; }
.section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #2a2a3a; }
.section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.toggle-row label { margin-bottom: 0; }
.toggle-switch { position: relative; width: 40px; height: 22px; background: #444; border-radius: 11px; cursor: pointer; transition: background 0.2s; }
.toggle-switch.active { background: #4ec9a0; }
.toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle-switch.active::after { transform: translateX(18px); }
.layer-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.layer-stat { padding: 3px 8px; border-radius: 10px; font-size: 11px; background: #2a2a3a; color: #8888a0; }
.layer-stat.role { background: rgba(124,138,255,0.2); color: #7c8aff; }
.layer-stat.project { background: rgba(78,201,160,0.2); color: #4ec9a0; }
.layer-stat.workflow { background: rgba(255,184,60,0.2); color: #ffb83c; }
.layer-stat.session { background: rgba(200,200,200,0.15); color: #ccc; }

/* 网站列表 */
.site-list { max-height: 150px; overflow-y: auto; }
.site-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #252532; border-radius: 8px; margin-bottom: 6px; font-size: 12px; }
.site-item .name { font-weight: 600; }
.site-item .host { color: #888; font-size: 11px; }
.site-item .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; }
.site-item .badge.builtin { background: rgba(124,138,255,0.2); color: #7c8aff; }
.site-item .badge.custom { background: rgba(78,201,160,0.2); color: #4ec9a0; }
.site-item .delete { color: #ff5c7a; cursor: pointer; font-size: 16px; padding: 0 4px; }
.site-item .delete:hover { opacity: 0.8; }

/* 标签页 */
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 12px; border-radius: 6px; cursor: pointer; background: #252532; color: #888; transition: all 0.2s; }
.tab.active { background: #7c8aff; color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-tab="main">主面板</div>
  <div class="tab" data-tab="sites">网站配置</div>
  <div class="tab" data-tab="selectors">选择器</div>
</div>

<!-- 主面板 -->
<div id="tab-main" class="tab-content active">
  <div class="section">
    <h3>⚙️ 配置</h3>
    <label for="apiBase">后端地址</label>
    <input type="text" id="apiBase" placeholder="http://localhost:8741">
    <button class="btn primary" id="saveBtn">保存配置</button>
  </div>

  <div class="section">
    <h3>🤖 自动提取</h3>
    <div class="toggle-row">
      <label>对话结束自动提取记忆</label>
      <div class="toggle-switch active" id="autoToggle"></div>
    </div>
    <div class="layer-stats" id="layerStats">
      <span class="layer-stat role">角色 0</span>
      <span class="layer-stat project">项目 0</span>
      <span class="layer-stat workflow">工作流 0</span>
      <span class="layer-stat session">会话 0</span>
    </div>
  </div>

  <div class="section">
    <h3>🧠 手动操作</h3>
    <button class="btn success" id="rememberBtn">🧠 提取这段对话</button>
    <button class="btn secondary" id="captureBtn">📄 采集到知识库</button>
    <button class="btn secondary" id="clipPageBtn">📄 剪藏当前网页</button>
  </div>

  <div class="section" id="douyinSection" style="display:none;">
    <h3>📹 抖音收藏导入</h3>
    <p style="font-size: 12px; color: #888; margin-bottom: 10px;">
      在抖音收藏页面点击下方按钮，自动采集并批量解析你收藏的视频。
    </p>
    <button class="btn success" id="douyinFavBtn">🔄 采集当前页收藏</button>
    <div id="douyinStatus" style="font-size: 12px; color: #888; margin-top: 8px; min-height: 18px;"></div>
    <div id="douyinLinkList" style="max-height: 120px; overflow-y: auto; font-size: 11px; color: #ccc; margin-top: 6px; display: none;"></div>
  </div>
</div>

<!-- 网站配置 -->
<div id="tab-sites" class="tab-content">
  <div class="section">
    <h3>🌐 已配置网站</h3>
    <div class="site-list" id="siteList">
      <!-- 动态填充 -->
    </div>
  </div>

  <div class="section">
    <h3>➕ 添加新网站</h3>
    <label>网站域名</label>
    <input type="text" id="newSiteHost" placeholder="例如: gemini.google.com">
    <label>网站名称</label>
    <input type="text" id="newSiteName" placeholder="例如: Gemini">
    <label>对话元素选择器</label>
    <input type="text" id="newSiteSelector" placeholder="例如: [class*=\"message\"]">
    <button class="btn success" id="addSiteBtn">添加网站</button>
  </div>

  <div class="section">
    <h4>💡 提示</h4>
    <p style="font-size: 12px; color: #888; line-height: 1.6;">
      1. 打开目标网站，按 F12 进入开发者工具<br>
      2. 用元素选择器工具选中对话气泡<br>
      3. 复制 CSS 选择器（如 <code>[class*="message"]</code>）<br>
      4. 粘贴到上方输入框，点击添加
    </p>
  </div>
</div>

<!-- 选择器配置 -->
<div id="tab-selectors" class="tab-content">
  <div class="section">
    <h3>🎯 可视化选择器</h3>
    <p style="font-size: 12px; color: #888; margin-bottom: 10px;">
      在任意网页点击"配置此网站"按钮，鼠标悬停高亮元素，点击即可保存选择器。
    </p>
    <div class="site-list" id="selectorList">
      <!-- 动态填充 -->
    </div>
  </div>
</div>

<div class="status" id="status"></div>

<script src="popup.js"></script>
</body>
</html>
