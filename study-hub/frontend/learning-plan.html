<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习计划</title>
<script src="https://cdn.jsdelivr.net/npm/marked@17.0.6/marked.min.js"></script>
<style>
:root {
  --bg: #0f0f14;
  --surface: #1a1a24;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-secondary: #8888a0;
  --accent: #7c8aff;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center;
  min-height: 100vh; padding: 40px 20px 80px;
  line-height: 1.7;
}
main { width: 100%; max-width: 800px; }
.nav { margin-bottom: 20px; }
.nav a { font-size: 13px; color: var(--text-secondary); text-decoration: none; }
.nav a:hover { color: var(--accent); }
.content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 32px;
}
.content h1 { font-size: 1.4rem; margin-bottom: 0.5em; color: #fff; }
.content h2 { font-size: 1.15rem; margin: 1.5em 0 0.5em; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.content h3 { font-size: 1.0rem; margin: 1.2em 0 0.4em; color: #c0c0d0; }
.content p { margin: 0.5em 0; font-size: 0.92rem; }
.content ul, .content ol { padding-left: 1.5em; margin: 0.5em 0; }
.content li { font-size: 0.9rem; margin: 0.25em 0; }
.content code { background: rgba(124,138,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
.content pre { background: #0d0d14; border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 0.8em 0; }
.content pre code { background: none; padding: 0; }
.content table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.88rem; }
.content th, .content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.content th { background: rgba(124,138,255,0.08); font-weight: 600; }
.content strong { color: #fff; }
.content a { color: var(--accent); }
.content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin: 0.8em 0; color: var(--text-secondary); }
.content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
.loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<main>
  <div class="nav"><a href="/learning.html">← 学习路线</a></div>
  <div class="content" id="content"><div class="loading">加载中...</div></div>
</main>
<script>
const PLANS = {
  'vibe-coding': 'vibe-coding-learning-plan.md',
  'super-learner': 'super-learner-plan.md'
};

const params = new URLSearchParams(window.location.search);
const planId = params.get('plan') || 'vibe-coding';
const file = PLANS[planId] || PLANS['vibe-coding'];

fetch(file)
  .then(r => { if (!r.ok) throw new Error('404'); return r.text(); })
  .then(md => {
    const html = typeof marked !== 'undefined' ? marked.parse(md) : md.replace(/</g,'&lt;');
    document.getElementById('content').innerHTML = html;
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<div class="loading">加载失败，请返回重试</div>';
  });
</script>
</body>
</html>
