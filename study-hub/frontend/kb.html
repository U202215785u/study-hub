<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理 - 学习中枢</title>
<style>
:root {
  --bg: #0f0f14;
  --surface: #1a1a24;
  --surface-hover: #22222f;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-secondary: #8888a0;
  --accent: #7c8aff;
  --accent-glow: rgba(124, 138, 255, 0.15);
  --danger: #ff5c7a;
  --success: #4ade80;
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
}

/* 侧边栏 */
.sidebar {
  width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px;
}
.sidebar-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
}
.sidebar-header h2 { font-size: 16px; font-weight: 700; }
.sidebar-header a { color: var(--text-secondary); text-decoration: none; font-size: 13px; }
.sidebar-header a:hover { color: var(--accent); }
.edit-toggle {
  padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); font-size: 11px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
.edit-toggle.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.sidebar.editing .category-item { cursor: default; }
.category-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.category-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background 0.15s; font-size: 14px;
}
.category-item:hover { background: var(--surface-hover); }
.category-item.active { background: var(--accent-glow); border: 1px solid var(--accent); }
.category-item .cat-icon { font-size: 18px; }
.category-item .cat-name { flex: 1; }
.category-item .cat-count { color: var(--text-secondary); font-size: 12px; }
.category-item .cat-actions { display: none; gap: 4px; }
.sidebar.editing .category-item .cat-actions { display: flex; }
.cat-actions button {
  width: 24px; height: 24px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06); color: var(--text-secondary);
}
.cat-actions button:hover { background: var(--accent); color: #fff; }
.cat-actions button.del-btn:hover { background: var(--danger); }
.add-cat-btn {
  display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text-secondary); font-size: 13px; border: 1px dashed var(--border);
  margin-top: 8px; transition: background 0.15s;
}
.add-cat-btn:hover { background: var(--surface-hover); color: var(--accent); border-color: var(--accent); }

/* 主内容区 */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar {
  display: flex; align-items: center; gap: 12px; padding: 16px 24px;
  background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.toolbar h3 { font-size: 15px; font-weight: 600; margin-right: auto; }
.doc-count { color: var(--text-secondary); font-size: 13px; }

.search-box {
  padding: 8px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 13px; outline: none; width: 200px;
}
.search-box:focus { border-color: var(--accent); }

.btn {
  padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s; white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { opacity: 0.9; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* 文档表格 */
.doc-table-wrap { flex: 1; overflow-y: auto; padding: 16px 24px; }
.doc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.doc-table th {
  text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
  color: var(--text-secondary); font-weight: 600; font-size: 12px; text-transform: uppercase;
  position: sticky; top: 0; background: var(--bg);
}
.doc-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.doc-table tr:hover td { background: var(--surface-hover); }
.doc-table .col-check { width: 36px; }
.doc-table .col-title { }
.doc-table .col-cat { width: 100px; }
.doc-table .col-tags { width: 180px; }
.doc-table .col-meta { width: 100px; }
.doc-table .col-actions { width: 120px; }
.doc-title-link { color: var(--text); text-decoration: none; cursor: pointer; font-weight: 500; }
.doc-title-link:hover { color: var(--accent); }
.cat-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
  border-radius: 12px; font-size: 11px; background: var(--surface); border: 1px solid var(--border);
}
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
  background: var(--accent-glow); color: var(--accent); margin: 1px 2px;
}
.text-secondary { color: var(--text-secondary); font-size: 12px; }
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

/* 弹窗 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 24px; width: 90%; max-width: 480px; display: flex; flex-direction: column; gap: 16px;
}
.modal.wide { max-width: 700px; }
.modal h3 { font-size: 16px; }
.modal input, .modal select, .modal textarea {
  padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px; outline: none;
}
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
.modal textarea { resize: vertical; min-height: 80px; font-family: inherit; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.color-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.color-dot {
  width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
}
.color-dot.selected { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }

.doc-content-preview { max-height: 55vh; overflow-y: auto; font-size: 14px;
  line-height: 1.75; background: var(--bg); padding: 16px; border-radius: var(--radius-sm); }
.doc-content-preview h1, .doc-content-preview h2, .doc-content-preview h3 { margin: 14px 0 6px; font-weight: 600; }
.doc-content-preview h1 { font-size: 1.35em; }
.doc-content-preview h2 { font-size: 1.15em; }
.doc-content-preview h3 { font-size: 1.05em; }
.doc-content-preview p { margin: 4px 0 8px; }
.doc-content-preview ul, .doc-content-preview ol { padding-left: 22px; margin: 4px 0 8px; }
.doc-content-preview code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
.doc-content-preview pre { background: var(--surface); padding: 12px; border-radius: var(--radius-sm); overflow-x: auto; margin: 6px 0 12px; }
.doc-content-preview pre code { background: none; padding: 0; }
.doc-content-preview blockquote { border-left: 3px solid var(--accent); padding: 8px 14px; margin: 10px 0; color: var(--text-secondary); background: rgba(124,138,255,0.06); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13px; }
.doc-content-preview table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
.doc-content-preview th, .doc-content-preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.doc-content-preview th { background: var(--surface); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
.doc-content-preview tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.doc-content-preview a { color: var(--accent); }
.doc-content-preview hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.doc-content-preview img { max-width: 100%; border-radius: var(--radius-sm); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* 批量操作栏 */
.batch-bar {
  display: none; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--accent-glow); border: 1px solid var(--accent);
  border-radius: var(--radius-sm); margin-bottom: 12px;
}
.batch-bar.visible { display: flex; }
.batch-bar span { font-size: 13px; margin-right: 8px; }

/* 标签编辑 */
.tag-edit-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tag-edit-wrap input {
  width: 80px; padding: 2px 6px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 11px; outline: none;
}
.tag-edit-wrap input:focus { border-color: var(--accent); }
.tag-remove { cursor: pointer; opacity: 0.5; font-size: 10px; }
.tag-remove:hover { opacity: 1; color: var(--danger); }
</style>
  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.6/marked.min.js"></script>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
  <div class="sidebar-header">
    <h2>知识库管理</h2>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="edit-toggle" id="editToggleBtn" onclick="toggleEditMode()" title="切换编辑模式">编辑</button>
      <a href="/" title="返回仪表盘">← 仪表盘</a>
    </div>
  </div>
  <div class="category-list" id="categoryList"></div>
  <div class="add-cat-btn" onclick="openCatModal()">+ 新建分类</div>
</div>

<!-- 主内容区 -->
<div class="main">
  <div class="toolbar">
    <h3 id="currentTitle">全部文档</h3>
    <span class="doc-count" id="docCount"></span>
    <input type="text" class="search-box" id="searchBox" placeholder="搜索文档标题…" oninput="renderDocs()">
    <button class="btn" onclick="document.getElementById('fileInput').click()">上传文档</button>
    <input type="file" id="fileInput" accept=".txt,.md,.pdf" multiple style="display:none" onchange="handleUpload(this)">
    <button class="btn" id="pasteBtn">粘贴文本</button>
    <button class="btn danger" id="batchDeleteBtn" style="display:none" onclick="batchDelete()">批量删除</button>
  </div>
  <div class="doc-table-wrap">
    <div class="batch-bar" id="batchBar">
      <span id="batchCount">已选 0 项</span>
      <select id="batchMoveSelect" class="btn btn-sm">
        <option value="">移动到…</option>
      </select>
      <button class="btn btn-sm" id="batchMoveBtn" disabled>移动</button>
      <button class="btn btn-sm" onclick="clearSelection()">取消选择</button>
    </div>
    <table class="doc-table">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
          <th class="col-title">文档标题</th>
          <th class="col-cat">分类</th>
          <th class="col-tags">标签</th>
          <th class="col-meta">信息</th>
          <th class="col-actions">操作</th>
        </tr>
      </thead>
      <tbody id="docTableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">📄</div>
      <p>暂无文档。上传文档或粘贴文本开始构建知识库。</p>
    </div>
  </div>
</div>

<!-- 分类弹窗 -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <h3 id="catModalTitle">新建分类</h3>
    <input type="text" id="catName" placeholder="分类名称">
    <div>
      <span style="font-size:12px;color:var(--text-secondary);">图标</span>
      <input type="text" id="catIcon" value="📁" maxlength="2" style="width:60px;">
    </div>
    <div>
      <span style="font-size:12px;color:var(--text-secondary);">颜色</span>
      <div class="color-pick" id="colorPick"></div>
      <input type="hidden" id="catColor" value="#7c8aff">
    </div>
    <div class="modal-actions">
      <button class="btn" id="catCancel">取消</button>
      <button class="btn primary" id="catSave">保存</button>
    </div>
  </div>
</div>

<!-- 文档内容弹窗 -->
<div class="modal-overlay" id="docModal">
  <div class="modal wide">
    <h3 id="docModalTitle">文档内容</h3>
    <div class="doc-content-preview" id="docContent"></div>
    <div class="modal-actions">
      <button class="btn" id="docSendClaude">复制全文 & 打开 Claude</button>
      <button class="btn" id="docClose">关闭</button>
    </div>
  </div>
</div>

<!-- 标签编辑弹窗 -->
<div class="modal-overlay" id="tagModal">
  <div class="modal">
    <h3>编辑标签</h3>
    <div class="tag-edit-wrap" id="tagEditWrap"></div>
    <input type="text" id="newTagInput" placeholder="输入新标签，回车添加" style="margin-top:8px;">
    <div class="modal-actions">
      <button class="btn" id="tagCancel">取消</button>
      <button class="btn primary" id="tagSave">保存</button>
    </div>
  </div>
</div>

<!-- 粘贴文本弹窗 -->
<div class="modal-overlay" id="pasteModal">
  <div class="modal" style="max-width:600px;">
    <h3>粘贴文本到知识库</h3>
    <input type="text" id="pasteTitle" placeholder="文档标题">
    <textarea id="pasteContent" placeholder="粘贴文本内容…" style="min-height:200px;"></textarea>
    <select id="pasteCategory">
      <option value="">无分类</option>
    </select>
    <div class="modal-actions">
      <button class="btn" id="pasteCancelBtn">取消</button>
      <button class="btn primary" id="pasteSaveBtn">存入知识库</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== 配置 =====
const API_BASE = (() => {
  const stored = localStorage.getItem('api_base');
  if (stored) return stored;
  return window.location.origin || 'http://localhost:8741';
})();

// ===== 帮助函数 =====
function $(id) { return document.getElementById(id); }
function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2500);
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderMd(str) {
  if (!str) return '';
  try {
    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true });
      return marked.parse(str);
    }
  } catch (e) {}
  return escapeHtml(str).replace(/\n/g, '<br>');
}

// ===== 颜色选择 =====
const COLORS = ['#7c8aff', '#4ade80', '#f59e0b', '#ef4444', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316'];
const colorPick = $('colorPick');
let selectedColor = '#7c8aff';

colorPick.innerHTML = COLORS.map(c => `
  <div class="color-dot${c === selectedColor ? ' selected' : ''}" style="background:${c}" onclick="pickColor('${c}')"></div>
`).join('');

function pickColor(c) {
  selectedColor = c;
  $('catColor').value = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  event.target.classList.add('selected');
}

// ===== 状态 =====
let categories = [];
let documents = [];
let currentCatId = null; // null = 全部
let selectedDocs = new Set();
let editingCatId = null;
let editingTagDocId = null;
let editingTags = [];
let sidebarEditing = false;

function toggleEditMode() {
  sidebarEditing = !sidebarEditing;
  const sidebar = document.querySelector('.sidebar');
  const btn = document.getElementById('editToggleBtn');
  if (sidebarEditing) {
    sidebar.classList.add('editing');
    btn.textContent = '完成';
    btn.classList.add('active');
  } else {
    sidebar.classList.remove('editing');
    btn.textContent = '编辑';
    btn.classList.remove('active');
  }
}

// ===== 加载数据 =====
async function loadCategories() {
  try {
    const res = await fetch(`${API_BASE}/categories`);
    categories = await res.json();
  } catch { categories = []; }
  renderCategories();
}

async function loadDocuments() {
  try {
    let url = `${API_BASE}/documents`;
    if (currentCatId !== null) url += `?category_id=${currentCatId}`;
    const res = await fetch(url);
    documents = await res.json();
  } catch { documents = []; }
  renderDocs();
}

// ===== 侧边栏 =====
function renderCategories() {
  const list = $('categoryList');
  let html = `
    <div class="category-item${currentCatId === null ? ' active' : ''}" onclick="selectCategory(null)">
      <span class="cat-icon">📚</span>
      <span class="cat-name">全部文档</span>
      <span class="cat-count">${documents.length || ''}</span>
    </div>
  `;

  categories.forEach(cat => {
    html += `
      <div class="category-item${currentCatId === cat.id ? ' active' : ''}" onclick="selectCategory(${cat.id})">
        <span class="cat-icon">${cat.icon || '📁'}</span>
        <span class="cat-name">${escapeHtml(cat.name)}</span>
        <span class="cat-count">${cat.doc_count || 0}</span>
        <span class="cat-actions">
          <button onclick="event.stopPropagation();openCatModal(${cat.id})" title="编辑">✎</button>
          <button class="del-btn" onclick="event.stopPropagation();deleteCat(${cat.id})" title="删除">×</button>
        </span>
      </div>
    `;
  });

  html += `
    <div class="category-item${currentCatId === 0 ? ' active' : ''}" onclick="selectCategory(0)">
      <span class="cat-icon">📭</span>
      <span class="cat-name">未分类</span>
    </div>
  `;

  list.innerHTML = html;

  // 更新批量移动下拉框
  const select = $('batchMoveSelect');
  select.innerHTML = '<option value="">移动到…</option>' +
    categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');

  // 更新粘贴弹窗的分类下拉框
  const pasteSel = $('pasteCategory');
  if (pasteSel) {
    pasteSel.innerHTML = '<option value="">无分类</option>' +
      categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  }
}

function selectCategory(catId) {
  currentCatId = catId;
  selectedDocs.clear();
  updateBatchBar();
  const catName = catId === null ? '全部文档' : catId === 0 ? '未分类' :
    (categories.find(c => c.id === catId)?.name || '');
  $('currentTitle').textContent = catName || '全部文档';
  renderCategories();
  loadDocuments();
}

// ===== 文档列表 =====
function renderDocs() {
  const tbody = $('docTableBody');
  const searchTerm = ($('searchBox').value || '').toLowerCase();
  let filtered = documents;
  if (searchTerm) {
    filtered = documents.filter(d => (d.title || '').toLowerCase().includes(searchTerm));
  }

  $('docCount').textContent = `${filtered.length} 篇文档`;

  if (!filtered.length) {
    tbody.innerHTML = '';
    $('emptyState').style.display = 'block';
    $('batchDeleteBtn').style.display = 'none';
    return;
  }

  $('emptyState').style.display = 'none';
  $('batchDeleteBtn').style.display = '';

  tbody.innerHTML = filtered.map(d => {
    let tags = [];
    try { tags = JSON.parse(d.tags || '[]'); } catch { tags = []; }
    const tagsHtml = tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
    const catBadge = d.category_name
      ? `<span class="cat-badge">${d.category_icon || '📁'} ${escapeHtml(d.category_name)}</span>`
      : '<span class="text-secondary">未分类</span>';
    const checked = selectedDocs.has(d.id) ? 'checked' : '';

    return `
      <tr>
        <td class="col-check"><input type="checkbox" ${checked} onchange="toggleDoc(${d.id})"></td>
        <td class="col-title">
          <span class="doc-title-link" onclick="viewDoc(${d.id})">${escapeHtml(d.title)}</span>
        </td>
        <td class="col-cat">${catBadge}</td>
        <td class="col-tags">${tagsHtml || '<span class="text-secondary">-</span>'}</td>
        <td class="col-meta">
          <span class="text-secondary">${d.char_count || 0}字<br>${(d.created_at || '').slice(0, 10)}</span>
        </td>
        <td class="col-actions">
          <button class="btn btn-sm" onclick="moveDocPrompt(${d.id})" title="移动">移</button>
          <button class="btn btn-sm" onclick="editTags(${d.id})" title="标签">标</button>
          <button class="btn btn-sm" onclick="deleteDoc(${d.id})" title="删除" style="color:var(--danger);">删</button>
        </td>
      </tr>
    `;
  }).join('');

  updateSelectAllCheckbox();
}

// ===== 选择逻辑 =====
function toggleDoc(id) {
  if (selectedDocs.has(id)) selectedDocs.delete(id);
  else selectedDocs.add(id);
  updateBatchBar();
  updateSelectAllCheckbox();
  renderDocs();
}

function toggleSelectAll() {
  const checked = $('selectAll').checked;
  const searchTerm = ($('searchBox').value || '').toLowerCase();
  let filtered = documents;
  if (searchTerm) filtered = documents.filter(d => (d.title || '').toLowerCase().includes(searchTerm));

  if (checked) {
    filtered.forEach(d => selectedDocs.add(d.id));
  } else {
    filtered.forEach(d => selectedDocs.delete(d.id));
  }
  updateBatchBar();
  renderDocs();
}

function updateSelectAllCheckbox() {
  const searchTerm = ($('searchBox').value || '').toLowerCase();
  let filtered = documents;
  if (searchTerm) filtered = documents.filter(d => (d.title || '').toLowerCase().includes(searchTerm));
  $('selectAll').checked = filtered.length > 0 && filtered.every(d => selectedDocs.has(d.id));
}

function clearSelection() {
  selectedDocs.clear();
  updateBatchBar();
  renderDocs();
}

function updateBatchBar() {
  const bar = $('batchBar');
  if (selectedDocs.size > 0) {
    bar.classList.add('visible');
    $('batchCount').textContent = `已选 ${selectedDocs.size} 项`;
    $('batchMoveBtn').disabled = !$('batchMoveSelect').value;
  } else {
    bar.classList.remove('visible');
  }
}

$('batchMoveSelect').onchange = () => {
  $('batchMoveBtn').disabled = !$('batchMoveSelect').value;
};

$('batchMoveBtn').onclick = async () => {
  const catId = $('batchMoveSelect').value;
  if (!catId) return;
  try {
    const res = await fetch(`${API_BASE}/documents/batch-move`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_ids: [...selectedDocs], category_id: parseInt(catId) }),
    });
    await res.json();
    toast(`已移动 ${selectedDocs.size} 篇文档`);
    clearSelection();
    loadCategories();
    loadDocuments();
  } catch { toast('移动失败', true); }
};

async function moveDocPrompt(docId) {
  const doc = documents.find(d => d.id === docId);
  if (!doc) return;
  const targetId = prompt(
    '移动到哪个分类？\n' +
    categories.map(c => `${c.id}: ${c.name}`).join('\n') +
    '\n\n输入分类 ID（留空 = 移除分类）：'
  );
  if (targetId === null) return;
  try {
    const body = { category_id: targetId === '' ? null : parseInt(targetId) };
    const res = await fetch(`${API_BASE}/documents/${docId}/move`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) { toast(data.error, true); return; }
    toast(targetId === '' ? '已移除分类' : `已移动到 ${data.category_name}`);
    loadCategories();
    loadDocuments();
  } catch { toast('移动失败', true); }
}

async function batchDelete() {
  if (!confirm(`确认删除 ${selectedDocs.size} 篇文档？此操作不可恢复。`)) return;
  try {
    const res = await fetch(`${API_BASE}/documents/batch-delete`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_ids: [...selectedDocs] }),
    });
    const data = await res.json();
    toast(`已删除 ${data.count} 篇文档`);
    clearSelection();
    loadCategories();
    loadDocuments();
  } catch { toast('批量删除失败', true); }
}

async function deleteDoc(docId) {
  const doc = documents.find(d => d.id === docId);
  if (!doc) return;
  if (!confirm(`确认删除 "${doc.title}"？`)) return;
  try {
    await fetch(`${API_BASE}/documents/${docId}`, { method: 'DELETE' });
    toast('已删除');
    if (selectedDocs.has(docId)) { selectedDocs.delete(docId); updateBatchBar(); }
    loadCategories();
    loadDocuments();
  } catch { toast('删除失败', true); }
}

// ===== 分类弹窗 =====
function openCatModal(catId) {
  editingCatId = catId || null;
  if (catId) {
    const cat = categories.find(c => c.id === catId);
    if (!cat) return;
    $('catModalTitle').textContent = '编辑分类';
    $('catName').value = cat.name;
    $('catIcon').value = cat.icon;
    selectedColor = cat.color;
    $('catColor').value = cat.color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    const dot = document.querySelector(`.color-dot[style*="${cat.color}"]`);
    if (dot) dot.classList.add('selected');
  } else {
    $('catModalTitle').textContent = '新建分类';
    $('catName').value = '';
    $('catIcon').value = '📁';
    selectedColor = '#7c8aff';
    $('catColor').value = '#7c8aff';
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    const dot = document.querySelector('.color-dot');
    if (dot) dot.classList.add('selected');
  }
  $('catModal').classList.add('visible');
  $('catName').focus();
}

$('catCancel').onclick = () => { $('catModal').classList.remove('visible'); };
$('catSave').onclick = async () => {
  const name = $('catName').value.trim();
  if (!name) { toast('请输入分类名称', true); return; }
  const icon = $('catIcon').value || '📁';
  const color = $('catColor').value;

  try {
    let res;
    if (editingCatId) {
      res = await fetch(`${API_BASE}/categories/${editingCatId}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, icon, color }),
      });
    } else {
      res = await fetch(`${API_BASE}/categories`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, icon, color }),
      });
    }
    const data = await res.json();
    if (data.error) { toast(data.error, true); return; }
    toast(editingCatId ? '分类已更新' : '分类已创建');
    $('catModal').classList.remove('visible');
    editingCatId = null;
    loadCategories();
  } catch { toast('操作失败', true); }
};

async function deleteCat(catId) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;
  if (!confirm(`删除分类 "${cat.name}"？文档不会被删除，会变为未分类。`)) return;
  try {
    await fetch(`${API_BASE}/categories/${catId}`, { method: 'DELETE' });
    toast('分类已删除');
    if (currentCatId === catId) selectCategory(null);
    else loadCategories();
  } catch { toast('删除失败', true); }
}

// ===== 文档操作 =====
async function viewDoc(id) {
  try {
    const res = await fetch(`${API_BASE}/documents/${id}`);
    const doc = await res.json();
    $('docModalTitle').textContent = doc.title;
    $('docContent').innerHTML = renderMd(doc.content || '');
    $('docModal').classList.add('visible');
    $('docSendClaude').onclick = () => sendToClaude(doc);
  } catch { toast('加载文档失败', true); }
}

async function sendToClaude(doc) {
  try {
    await navigator.clipboard.writeText(doc.content || '');
    window.open('https://claude.ai', '_blank');
    toast('内容已复制，请粘贴到 Claude');
  } catch {
    toast('复制失败', true);
  }
}

$('docClose').onclick = () => { $('docModal').classList.remove('visible'); };

// ===== 标签编辑 =====
function editTags(docId) {
  editingTagDocId = docId;
  const doc = documents.find(d => d.id === docId);
  if (!doc) return;
  try { editingTags = JSON.parse(doc.tags || '[]'); } catch { editingTags = []; }
  renderTagEdit();
  $('tagModal').classList.add('visible');
}

function renderTagEdit() {
  $('tagEditWrap').innerHTML = editingTags.map((t, i) => `
    <span class="tag">${escapeHtml(t)} <span class="tag-remove" onclick="removeTag(${i})">×</span></span>
  `).join('');
}

function removeTag(idx) {
  editingTags.splice(idx, 1);
  renderTagEdit();
}

$('newTagInput').onkeydown = (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = $('newTagInput').value.trim();
    if (val && !editingTags.includes(val)) {
      editingTags.push(val);
      $('newTagInput').value = '';
      renderTagEdit();
    }
  }
};

$('tagCancel').onclick = () => { $('tagModal').classList.remove('visible'); };
$('tagSave').onclick = async () => {
  if (editingTagDocId === null) return;
  try {
    await fetch(`${API_BASE}/documents/${editingTagDocId}/tags`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tags: editingTags }),
    });
    toast('标签已保存');
    $('tagModal').classList.remove('visible');
    loadDocuments();
  } catch { toast('保存失败', true); }
};

// ===== 上传 =====
async function handleUpload(input) {
  const files = input.files;
  if (!files.length) return;
  for (const file of files) {
    try {
      const form = new FormData();
      form.append('file', file);
      if (currentCatId !== null && currentCatId !== 0) {
        form.append('category_id', currentCatId);
      }
      const res = await fetch(`${API_BASE}/upload`, { method: 'POST', body: form });
      const data = await res.json();
      if (data.id) toast(`"${file.name}" 上传成功`);
      else toast(`上传失败: ${data.detail || data.error}`, true);
    } catch { toast(`上传 "${file.name}" 失败`, true); }
  }
  input.value = '';
  loadCategories();
  loadDocuments();
}

// ===== 粘贴 =====
$('pasteBtn').onclick = () => {
  $('pasteTitle').value = '';
  $('pasteContent').value = '';
  $('pasteCategory').value = currentCatId && currentCatId !== 0 ? currentCatId : '';
  $('pasteModal').classList.add('visible');
  $('pasteTitle').focus();
};
$('pasteCancelBtn').onclick = () => { $('pasteModal').classList.remove('visible'); };
$('pasteSaveBtn').onclick = async () => {
  const title = $('pasteTitle').value.trim();
  const content = $('pasteContent').value.trim();
  if (!title || !content) { toast('请填写标题和内容', true); return; }
  const catId = $('pasteCategory').value;
  try {
    const res = await fetch(`${API_BASE}/upload/text`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content, source: 'paste', category_id: catId ? parseInt(catId) : null }),
    });
    const data = await res.json();
    if (data.id) {
      toast('已存入知识库');
      $('pasteModal').classList.remove('visible');
      loadCategories();
      loadDocuments();
    } else {
      toast('失败: ' + (data.error || '未知错误'), true);
    }
  } catch { toast('存入失败', true); }
};

// ===== 弹窗关闭 =====
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('visible');
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.visible').forEach(m => m.classList.remove('visible'));
  }
});

// ===== 初始化 =====
loadCategories();
loadDocuments();
</script>
</body>
</html>
