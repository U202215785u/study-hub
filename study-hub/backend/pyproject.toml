[project]
name = "study-hub"
version = "0.6.0"
description = "浏览器新标签页变身学习操作系统"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "chromadb>=0.4.0",
    "watchdog>=4.0.0",
    "sentence-transformers>=2.2.0",
    "dashscope>=1.20.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
social = ["douyin-mcp-server>=1.2.0"]
dev = ["pytest>=8.0.0", "httpx>=0.25.0"]

[tool.uv.pip]
# uv 用户可直接: uv pip install -e .
